# Boxes for invader pieces in Spirit Island.
shapes:
- id: "invader-box-1"
  type: "box" 
  dimensions: [75.0, 60.0, 79.0]
  faces:
    - name: "top"
      type: "open"
  features:
  - face: "top"
    type: "raster-engraving"
    source: "images/Explorer.svg"
    width: 240.0
    height: 83.2
    position:
      anchor: "center"
