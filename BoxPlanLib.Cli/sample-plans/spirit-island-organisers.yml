# An organiser for the game Spirit Island, designed to hold the various components of the game in a compact and efficient manner.
# The organiser includes an exterior case, and includes compartments for the different types of cards, tokens, and other game pieces.
# Sketchup red axis is x, blue axis is y, green axis is z.

