- id: "divider-branch-and-claw"
  type: "panel"
  location: [0.0, 0.0, 0.0]
  origin: "bottom-left-front"
  profile:
    type: "rectangle"
    width: 68.0
    height: 98.0
  features:
    - type: "engraving"
      position:
        anchor: "top-left"
        offset: [3.0, -1.0]
      font: "DK Snemand"
      style: "bold"
      text: "Branch & Claw"
      size: 5
    - type: "cutout"
      shape: "rectangle"
      width: 25.4
      height: 50.8
      position:
        anchor: "top-right"
        offset: [-6.0, 0.0]
- id: "divider-branch-and-claw-notch-1"
