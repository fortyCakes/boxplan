shapes:

  # ---- The outer frame ----------------------------------------------------
  - id: "frame"
    type: "box"
    dimensions: [30.0, 30.0, 40.0]
    origin: "bottom-left-front"
    location: [0.0, 0.0, 0.0]

    faces:
      - name: "back"
        type: "open"
      - name: "front"
        type: "closed"
      - name: "top"
        type: "open"
      - name: "bottom"
        type: "open"
      - name: "left"
        type: "open"
      - name: "right"
        type: "open"

    features:
      - face: "front"
        type: "cutout"
        shape: "semicircle"
        diameter: -20.0
        position:
          anchor: "top-center"
          offset: [0.0, 5.0]  