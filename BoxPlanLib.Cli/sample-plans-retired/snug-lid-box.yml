shapes:
- id: "sample-box-case"
  type: "box"
  dimensions: [100.0, 50.0, 100.0] 
  location: [0.0, 0.0, 0.0] 
  origin: "bottom-left-front"
  faces:
  - name: "top"
    type: "open"

  inserts:
  - fill: "all-cells"
    ref: "snug-fit-base"

- id: "snug-fit-base"
  type: "box"
  fit:
    mode: "cell"
    clearance: 0.1    # 0.1mm all around inside the cell
    depth: auto+10.0    # auto+10.0 means "use the cell depth plus 10mm" — this creates a snug fit with a little extra depth for the lid to fit on.

  faces:
  - name: "top"
    type: "open"    
  
- id: "sample-box-lid"
  type: "box"
  dimensions: [100.0, 50.0, 100.0]
  location: [0.0, 100.0, 0.0]
  origin: "bottom-left-front"
  faces:
  - name: "bottom"
    type: "open"