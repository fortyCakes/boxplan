# A 1-2-3 staircase made of three boxes stacked on top of each other.
# Each box rests on the one below it, sharing a face. The cutting pipeline
# detects the contact areas, fuses the three boxes into a single solid, and
# emits face panels with all internal contact regions culled.
#
# Lower step:  300 wide x 100 tall x 100 deep (mm), origin at (0,0,0)
# Middle step: 200 wide x 100 tall x 100 deep, sitting on top of the lower
# Upper step:  100 wide x 100 tall x 100 deep, sitting on top of the middle
shapes:
  - id: "lower"
    type: "box"
    dimensions: [71.2, 12.7, 25.4]
    location: [0.0, 0.0, 0.0]

  - id: "middle"
    type: "box"
    dimensions: [50.8, 12.7, 25.4]
    location: [0.0, 12.7, 0.0]

  - id: "upper"
    type: "box"
    dimensions: [25.4, 12.7, 25.4]
    location: [0.0, 25.4, 0.0]
