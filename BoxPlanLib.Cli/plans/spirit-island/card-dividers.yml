shapes:
- id: "divider-branch-and-claw"
  type: "panel"
  location: [0.0, 0.0, 0.0]
  origin: "bottom-left-front"
  profile:
    type: "rectangle"
    width: 68.0
    height: 98.0
  features:
    - type: "engraving"
      position:
        anchor: "top-left"
        offset: [12, -2.3]
      font: "DK Snemand"
      text: "Branch & Claw"
      size: 3
    - type: "cutout"
      shape: "edge-dip"
      width: 25.4
      height: 50.8
      radius: 5.0
      inner-radius: 5.0
      position:
        anchor: "top-center"
        offset: [15.0, 0.0]
    - type: "raster-engraving"
      source: "images/48px-Expansion.png"
      height: 8.0
      position:
        anchor: "top-left"
        offset: [2.0, -2.0]
- id: "divider-branch-and-claw-notch-1"
