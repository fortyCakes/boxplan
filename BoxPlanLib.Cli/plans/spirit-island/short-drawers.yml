shapes:
# Shorter drawers for small components.
- id: "short-drawers-compartment"
  type: "box" 
  dimensions: [106.0, 161.0, 79.0]
  faces:
    - name: "front"
      type: "open"
  dividers:
    - split: { x: 2, y: 5 }
      facing: front
  inserts:
    - cell: [0, 0]
      ref: "short-drawer-1"
    - cell: [1, 0]
      ref: "short-drawer-2"
    - cell: [0, 1]
      ref: "short-drawer-3"
    - cell: [1, 1]
      ref: "short-drawer-4"
    - cell: [0, 2]
      ref: "short-drawer-5"
    - cell: [1, 2]
      ref: "short-drawer-6"
    - cell: [0, 3]
      ref: "short-drawer-7"
    - cell: [1, 3]
      ref: "short-drawer-8"
    - cell: [0, 4]
      ref: "short-drawer-9"
    - cell: [1, 4]
      ref: "short-drawer-10"

- id: "short-drawer-1"
  type: "box"

  fit:
    mode: "cell"
    clearance: 1.0
    depth: auto

  faces:
    - name: "top"
      type: "open"

  features:
    - face: "front"
      type: "cutout"
      shape: "edge-dip"
      width: 25.0
      height: 10.0
      radius: 5.0
      inner-radius: 5.0
      position:
        anchor: "top-center"
        offset: [0.0, 0.0]
    - face: "front"
      type: "svg-engraving"
      source: "images/Beasts.svg"
      height: 10.0
      position:
        anchor: "center"
        offset: [0.0, -3.0]

