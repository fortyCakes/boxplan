- id: "element-tokens"
  type: "box" 
  dimensions: [51.0, 32.0, 316.0]
  origin: "bottom-left-front"
  faces:
    - name: "top"
      type: "open"
  dividers:
    - split: { z: 8 }
      facing: top
  scoops:
    - face: bottom
      edge: [left, right]
      inset: 15
      rise: 15