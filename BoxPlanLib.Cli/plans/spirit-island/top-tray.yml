- id: "fear-and-terror"
  type: "box" 
  dimensions: [83.0, 32.0, 100.0]
  origin: "bottom-left-front"
  faces:
    - name: "top"
      type: "open"
  features:
    - face: "front"
      type: "cutout"
      shape: "edge-dip"
      height: 25.0
      width: 30.0
      radius: 5.0
      inner-radius: 5.0
      position:
        anchor: "top-center"
        offset: [0.0, 0.0]
    - face: "bottom"
      type: "svg-engraving"
      source: "images/Fear.svg"
      height: 50.0
      position:
        anchor: "center"
        offset: [0.0, 0.0]

- id: "events"
