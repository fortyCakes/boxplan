# A 3-wide x 2-tall drawer frame with 6 sliding drawers.
#
# Demonstrates the composable shape model:
#   - one primitive (`box`) for both the frame and the drawers
#   - `dividers` to subdivide the frame interior into a grid of cells
#   - `inserts` to place child shapes (the drawers) into those cells
#   - `features` to add a finger-pull cutout to each drawer front
#
# Exterior frame: 200 wide x 200 tall x 150 deep (mm).
# Cells are ~100 x 100 x 150 minus material/clearance.

shapes:

  # ---- The outer frame ----------------------------------------------------
  - id: "frame"
    type: "box"
    dimensions: [200.0, 200.0, 150.0]
    origin: "bottom-left-front"
    location: [0.0, 0.0, 0.0]

    faces:
      - name: "front"
        type: "open"                 # drawers slide in/out through the front

    dividers:
      # Subdivide the interior into a 3x2 grid.
      # Material thickness and kerf are applied by the engine.
      - split: { x: 3, y: 2 }
      # Division is applied facing the configured face, so the dividers here are smooth at the front and tabbed into the back.
        facing: front

    inserts:
      # One drawer per cell. `fill: all-cells` is sugar for emitting an
      # insert at every grid position — equivalent to writing six entries
      # with `cell: [0,0]`, `[1,0]`, ... `[2,1]`.
      - fill: "all-cells"
        ref: "drawer"

  # ---- The drawer (defined once, instanced six times) ---------------------
  - id: "drawer" # This ref is used by the "inserts" section of the frame above
    type: "box"

    # Auto-size to the enclosing cell rather than hard-coded dimensions.
    # `clearance` leaves a gap on each side for the drawer to slide.
    fit:
      mode: "cell"
      clearance: 1.0                 # 1mm all around inside the cell
      depth: auto                    # can be overridden by a fixed dimension if desired; "auto" (default) means "use the cell depth minus clearance"

    faces:
      - name: "top"
        type: "open"                 # open-top drawer

    features:
      - face: "front"
        type: "cutout"
        shape: "semicircle"
        diameter: 50.0
        position:
          anchor: "top-center"
          offset: [0.0, 15.0]           # 15mm above the top edge of the front face, so that only a small curved lip is cut into the drawer front for finger clearance
