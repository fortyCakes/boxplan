# A 1-2-3 staircase made of three boxes stacked on top of each other.
# Each box rests on the one below it, sharing a face. The cutting pipeline
# detects the contact areas, fuses the three boxes into a single solid, and
# emits face panels with all internal contact regions culled.
#
# Lower step:  30 wide x 10 tall x 10 deep (mm), origin at (0,0,0)
# Middle step: 20 wide x 10 tall x 10 deep, sitting on top of the lower
# Upper step:  10 wide x 10 tall x 10 deep, sitting on top of the middle
shapes:
  - id: "lower"
    type: "box"
    dimensions: [30.0, 10.0, 10.0]
    location: [0.0, 0.0, 0.0]

  - id: "middle"
    type: "box"
    dimensions: [20.0, 10.0, 10.0]
    location: [0.0, 10.0, 0.0]

  - id: "upper"
    type: "box"
    dimensions: [10.0, 10.0, 10.0]
    location: [0.0, 20.0, 0.0]
